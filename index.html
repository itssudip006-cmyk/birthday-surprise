<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
overflow:hidden;
font-family:Georgia,serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
background:#050010;
}

/* ===== NEW CINEMATIC BACKGROUND ===== */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(255,100,200,.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(100,150,255,.15), transparent 40%),
radial-gradient(circle at 50% 40%, rgba(255,255,255,.06), transparent 60%);
animation:bgMove 40s infinite alternate ease-in-out;
z-index:-3;
}

@keyframes bgMove{
0%{transform:scale(1)}
100%{transform:scale(1.2) rotate(3deg)}
}

/* ===== STARFIELD ===== */

.stars{
position:fixed;
width:100%;
height:100%;
z-index:-2;
background:transparent;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 4s infinite ease-in-out;
}

@keyframes twinkle{
0%,100%{opacity:.2;transform:scale(.8)}
50%{opacity:1;transform:scale(1.5)}
}

/* floating particles */

.particle{
position:fixed;
width:4px;
height:4px;
background:rgba(255,255,255,.6);
border-radius:50%;
animation:particleFloat 12s linear infinite;
z-index:-1;
}

@keyframes particleFloat{
from{transform:translateY(110vh)}
to{transform:translateY(-10vh)}
}

/* Floating Hearts */

.heart{
position:fixed;
bottom:-40px;
font-size:22px;
animation:float 12s linear forwards;
opacity:.8;
}

@keyframes float{
to{transform:translateY(-110vh);opacity:0}
}

/* Container */

.scene{
text-align:center;
width:90%;
max-width:600px;
}

/* HERO */

#hero{
animation:heroPush 8s ease-in-out infinite alternate;
}

@keyframes heroPush{
from{transform:scale(1)}
to{transform:scale(1.05)}
}

.hero-title{
font-size:3.2rem;
margin-bottom:1rem;
background:linear-gradient(90deg,#fff,#ff6b9d,#fff);
background-size:200% auto;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:textGlow 4s linear infinite;
position:relative;
overflow:hidden;
}

@keyframes textGlow{
0%{background-position:0%}
100%{background-position:200%}
}

.light-sweep{
position:absolute;
top:0;
left:-100%;
width:50%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
animation:sweep 4s infinite;
}

@keyframes sweep{
0%{left:-100%}
100%{left:150%}
}

.hero-subtitle{
font-size:1.4rem;
margin-bottom:2rem;
opacity:0;
animation:fadeSlide 2s 1s forwards;
}

@keyframes fadeSlide{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.hero-btn{
padding:1rem 2.5rem;
border-radius:40px;
border:none;
background:linear-gradient(45deg,#ff6b9d,#ff9cc9);
color:white;
font-size:1.1rem;
cursor:pointer;
box-shadow:0 0 20px rgba(255,107,157,.6);
animation:btnPulse 2.5s infinite ease-in-out;
transition:.3s;
}

.hero-btn:hover{
transform:scale(1.08);
box-shadow:0 0 35px rgba(255,107,157,.9);
}

@keyframes btnPulse{
0%,100%{box-shadow:0 0 15px rgba(255,107,157,.5)}
50%{box-shadow:0 0 35px rgba(255,107,157,1)}
}

/* LETTER */

.letter-box{
background:linear-gradient(135deg,#fffaf0,#f8f0e0);
color:#3c2000;
padding:2rem;
border-radius:18px;
box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.letter-box p{
margin:1rem 0;
line-height:1.8;
}

/* GALLERY */

.photo-card{
border-radius:20px;
overflow:hidden;
box-shadow:0 30px 90px rgba(0,0,0,.8);
opacity:0;
transition:opacity 1.5s ease;
}

.photo-card.show{opacity:1}

.photo-card img{
width:100%;
height:420px;
object-fit:cover;
animation:dolly 12s ease forwards;
}

@keyframes dolly{
from{transform:scale(1)}
to{transform:scale(1.12)}
}

.caption{
margin-top:1.5rem;
font-style:italic;
opacity:0;
transform:translateY(20px);
transition:1.2s ease;
}

.caption.show{
opacity:1;
transform:translateY(0);
}

.controls{
margin-top:1.5rem;
display:flex;
justify-content:center;
gap:1rem;
}

/* FINALE */

#finale{
opacity:0;
transition:2s ease;
}

#finale.show{opacity:1}

.final-heart{
font-size:8rem;
animation:pulse 2s infinite ease-in-out;
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.2)}
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<div class="scene">

<div id="hero">
<h1 class="hero-title">
Happy Birthday
<span class="light-sweep"></span>
</h1>
<p class="hero-subtitle">Amr Mukhphuli ❤️</p>
<button onclick="startLetter()" class="hero-btn">
Open Your Letter 💌
</button>
</div>

<div id="letter" hidden>
<div class="letter-box" id="letterContent"></div>
</div>

<div id="gallery" hidden>
<div class="photo-card" id="photoCard">
<img id="img">
</div>
<div class="caption" id="caption"></div>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="pauseToggle()" id="pauseBtn">Pause</button>
<button onclick="next()">Next</button>
</div>
</div>

<div id="finale" hidden>
<div class="final-heart">❤️</div>
<h2>Forever & Always Yours</h2>
</div>

</div>

<script>

/* STAR GENERATOR */

const starContainer=document.getElementById("stars");

for(let i=0;i<120;i++){
const s=document.createElement("div");
s.className="star";
s.style.top=Math.random()*100+"%";
s.style.left=Math.random()*100+"%";
s.style.animationDelay=Math.random()*4+"s";
starContainer.appendChild(s);
}

/* PARTICLES */

setInterval(()=>{
const p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"%";
document.body.appendChild(p);
setTimeout(()=>p.remove(),12000);
},800);

/* HEARTS */

setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.textContent="❤️";
h.style.left=Math.random()*100+"%";
document.body.appendChild(h);
setTimeout(()=>h.remove(),12000);
},3000);

/* MUSIC */

const music=document.getElementById("bgMusic");

function fadeInMusic(){
music.volume=0;
music.play();
let v=0;

const f=setInterval(()=>{
if(v<0.8){
v+=0.02;
music.volume=v;
}else clearInterval(f);
},200);
}

function fadeOutMusic(){

let f=setInterval(()=>{
if(music.volume>0.05){
music.volume-=0.05;
}else{
music.pause();
clearInterval(f);
}
},200);
}

/* LETTER */

const letterLines=[
"My dearest Mukhfuli,",
"",
"From the moment you came into my life,",
"everything started feeling a little more magical.",
"",
"Your smile brightens my darkest days,",
"your voice feels like home to my heart.",
"",
"On your birthday, I just want to remind you —",
"you are not just special,",
"you are my favorite part of this world.",
"",
"No matter where life takes us,",
"I promise I will always choose you.",
"",
"Today, tomorrow, and forever.",
"",
"Happy Birthday, my beautiful Mukhfuli ❤️"
];

let idx=0,timer,paused=false;

async function startLetter(){

fadeInMusic();

document.getElementById("hero").hidden=true;
document.getElementById("letter").hidden=false;

const box=document.getElementById("letterContent");

for(const line of letterLines){

const p=document.createElement("p");
box.appendChild(p);

for(let c of line){
p.textContent+=c;
await new Promise(r=>setTimeout(r,25));
}

await new Promise(r=>setTimeout(r,500));

}

setTimeout(()=>{
document.getElementById("letter").hidden=true;
startGallery();
},1200);

}

/* GALLERY */

const memories=[
{url:"1.jpg",txt:"The day my heart knew it was you forever 💫"},
{url:"2.jpg",txt:"Every journey feels magical with you 🌍❤️"},
{url:"3.jpg",txt:"Your smile lights my universe 😊"},
{url:"4.jpg",txt:"City lights or starry skies — always you ✨"},
{url:"5.jpg",txt:"Every heartbeat whispers your name 💞"},
{url:"6.jpg",txt:"Holding your hand feels like home 🤍"},
{url:"7.jpg",txt:"Silence becomes poetry when I’m with you 🌌"},
{url:"8.jpg",txt:"No matter what, I choose you. Always. ❤️"}
];

function startGallery(){
document.getElementById("gallery").hidden=false;
show(0);

timer=setInterval(()=>{
if(!paused)next();
},8000);
}

function show(i){

const card=document.getElementById("photoCard");
const img=document.getElementById("img");
const cap=document.getElementById("caption");

card.classList.remove("show");
cap.classList.remove("show");

setTimeout(()=>{

img.src=memories[i].url;

img.style.animation="none";
void img.offsetWidth;
img.style.animation="dolly 12s ease forwards";

cap.textContent=memories[i].txt;

card.classList.add("show");
cap.classList.add("show");

},600);

}

function next(){

idx++;

if(idx>=memories.length){

clearInterval(timer);

document.getElementById("gallery").hidden=true;

const f=document.getElementById("finale");
f.hidden=false;

setTimeout(()=>f.classList.add("show"),100);

fadeOutMusic();

}else show(idx);

}

function prev(){
idx=(idx-1+memories.length)%memories.length;
show(idx);
}

function pauseToggle(){
paused=!paused;
document.getElementById("pauseBtn").textContent=paused?"Play":"Pause";
}

</script>

</body>
</html>
